name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts .claude/hooks
      - name: Data is reproducible
        run: |
          python scripts/generate_data.py
          git diff --exit-code data/ tests/evals/answer_key.yaml
      - name: Test (unit, controls, engine evals)
        run: pytest -q --cov=cashapp
