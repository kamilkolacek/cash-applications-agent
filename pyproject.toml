[project]
name = "cashapp"
version = "1.0.0"
description = "Claude Code agent for cash application: match bank deposits to open AR and resolve exceptions, with human approval"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kamil Kolacek" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashapp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cashapp", "_bootstrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
